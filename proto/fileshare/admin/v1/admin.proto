// The admin API of fileshare: which shares exist, what they serve, and who may
// use them.
//
// It manages the shares IT created. A share written in the configuration files
// is listed, with the same fields, and a change to its definition is refused
// with FAILED_PRECONDITION: a share defined in two places is a question nobody
// wants to answer, and the file is where that one is defined. Taking it
// offline and back -- DisableShare, EnableShare -- is not a definition, and is
// allowed.
//
// Every change is applied before the call returns, and applying one restarts
// the protocol servers: their connections are closed, so a revocation reaches
// the sessions that were already open. A change the server cannot honour --
// an image that will not open, a name nobody in the directory has -- is
// refused, and what was being served is left as it was.
syntax = "proto3";

package fileshare.admin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-fileshare/fileshare/proto/fileshare/admin/v1;adminv1";

service AdminService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  rpc GetShare(GetShareRequest) returns (GetShareResponse);
  // CreateShare needs at least one grant. A share with none is open to
  // anyone who authenticates, which the configuration file can say on
  // purpose and an API call should not say by omission.
  rpc CreateShare(CreateShareRequest) returns (CreateShareResponse);
  rpc UpdateShare(UpdateShareRequest) returns (UpdateShareResponse);
  rpc DeleteShare(DeleteShareRequest) returns (DeleteShareResponse);

  // DisableShare stops serving a share and keeps its definition, the way
  // Samba's `available = no` does: every attempt to connect fails, the
  // connections already open are closed, and its image or directory is let
  // go of -- so the file can be replaced while it is disabled. EnableShare
  // serves it again, and is refused when its source can no longer be opened.
  //
  // Unlike every other change, these apply to a share of the configuration
  // too: taking a share offline is an operation, not a definition. It is
  // kept in the state file, and a restart does not bring the share back.
  rpc DisableShare(DisableShareRequest) returns (DisableShareResponse);
  rpc EnableShare(EnableShareRequest) returns (EnableShareResponse);

  // Grant gives a subject access to a share, or changes the access it has.
  rpc Grant(GrantRequest) returns (GrantResponse);
  // Revoke takes it away. Revoking the last grant is refused, for the reason
  // CreateShare needs one: delete the share instead.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);

  // ReloadDirectory reads the people again, now, rather than at the next
  // `reload` interval or SIGHUP. Only additions are applied in place; any
  // removal, changed credential, or share whose expanded lists changed
  // starts a new generation and closes the connections of the old one --
  // which is how disabling somebody in the directory reaches the sessions
  // they already have. A directory that cannot be read changes nothing, and
  // is UNAVAILABLE.
  rpc ReloadDirectory(ReloadDirectoryRequest) returns (ReloadDirectoryResponse);

  // Who a grant can name.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // Volumes: storage fileshare provisions -- a ZFS dataset, a btrfs
  // subvolume, an XFS or ext4 directory under a project quota -- through the
  // privileged `fileshare provisioner` named by the admin block's
  // `provisioner`. See docs/volumes.md.
  //
  // Each call is relayed to the provisioner, and its status code comes back
  // as the provisioner gave it: INVALID_ARGUMENT (a name outside the grammar,
  // an unknown parent, a quota of 0), OUT_OF_RANGE (above max_volume),
  // RESOURCE_EXHAUSTED (no room), ALREADY_EXISTS, NOT_FOUND,
  // FAILED_PRECONDITION, UNIMPLEMENTED (a snapshot of XFS or ext4). Two are
  // fileshare's own: FAILED_PRECONDITION when no provisioner is configured,
  // or when the provisioner refuses fileshare's uid (its client_uid is not
  // this server's), and UNAVAILABLE when it does not answer.
  //
  // Every Volume says which shares use it: the shares made from it, and any
  // share whose directory lies inside it.

  // ListParents is where volumes may be created, as the provisioner's own
  // configuration says.
  rpc ListParents(ListParentsRequest) returns (ListParentsResponse);
  // CreateVolume is idempotent by name: the same quota answers with the
  // volume that exists (created false), another is ALREADY_EXISTS.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  // ResizeVolume changes the quota, either way, never below what is used.
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);
  // SnapshotVolume takes a read-only snapshot (ZFS, btrfs).
  rpc SnapshotVolume(SnapshotVolumeRequest) returns (SnapshotVolumeResponse);
  // DeleteVolume is refused with FAILED_PRECONDITION while a share uses the
  // volume -- delete the share first. DeleteShare never deletes a volume.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
}

// Applied is what serving a change did.
message Applied {
  // The generation now being served; see ServerInfo.generation.
  uint64 generation = 1;
  // How many connections the previous generation had open, and closed.
  uint64 connections_closed = 2;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  ServerInfo info = 1;
}

message ServerInfo {
  // What the server calls itself to a client.
  string name = 1;
  string version = 2;
  google.protobuf.Timestamp started = 3;
  // How many lists of shares have been served since the start; it goes up by
  // one with every change applied.
  uint64 generation = 4;
  repeated Listener listeners = 5;
}

message Listener {
  string protocol = 1;
  string address = 2;
}

message ListSharesRequest {}

message ListSharesResponse {
  repeated Share shares = 1;
}

message GetShareRequest {
  string name = 1;
}

message GetShareResponse {
  Share share = 1;
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  // Written in a configuration file; read-only through this API.
  ORIGIN_CONFIG = 1;
  // Created through this API, and kept in its state file.
  ORIGIN_API = 2;
}

enum Access {
  ACCESS_UNSPECIFIED = 0;
  ACCESS_READ = 1;
  ACCESS_WRITE = 2;
}

// A Subject is who a grant is for, in the vocabulary the configuration file
// uses: a person, @group, oidc:groups:<value> or oidc:user:<name>.
message Subject {
  oneof kind {
    // Somebody in the directory.
    string user = 1;
    // A group of the directory, without the @.
    string group = 2;
    // A value of the identity provider's groups claim.
    string oidc_group = 3;
    // A name the identity provider vouches for.
    string oidc_user = 4;
  }
}

message Grant {
  Subject subject = 1;
  Access access = 2;
}

message Share {
  string name = 1;
  oneof source {
    // A disk image, or a device.
    string image = 2;
    // A directory tree of the host.
    string directory = 3;
    // A volume the provisioner made; served as a directory.
    VolumeRef volume = 14;
  }
  Origin origin = 4;
  // What was asked.
  bool read_only = 5;
  // What is served: read-only as asked, or because the source cannot take a
  // write -- a device, a chosen partition, a file that would not open for
  // writing -- or because nobody was granted ACCESS_WRITE.
  bool effective_read_only = 6;
  // The filesystem found or named in an image, or "directory".
  string filesystem = 7;
  // Which protocols may carry it; empty means every one that can honour it.
  repeated string protocols = 8;
  // For a configuration share, what its allow and writers lists mean.
  repeated Grant grants = 9;
  // Which protocols serve it now, and why the others do not.
  repeated string served_over = 10;
  repeated Refusal refusals = 11;
  uint64 size_bytes = 12;
  // False when DisableShare took it offline. A disabled share is listed with
  // what it would serve, and serves nothing.
  bool enabled = 13;
  // Why a share that is not disabled is not served at all: its volume is
  // gone, or failed a check before serving. Empty when it is served.
  // EnableShare tries it again.
  string unavailable = 15;
}

message Refusal {
  string protocol = 1;
  string reason = 2;
}

message CreateShareRequest {
  string name = 1;
  // Each must lie under one of the admin block's source_roots: an image or a
  // directory as given, a volume at the path the provisioner answers with.
  oneof source {
    string image = 2;
    string directory = 3;
    // A volume, served as a directory once these hold: its path is absolute,
    // under source_roots, a directory, on the filesystem its kind says
    // (statfs), and -- ZFS -- a mount point; btrfs, a subvolume's root;
    // XFS and ext4, under a project id that its new files inherit. Refused
    // while this server runs as root or holds CAP_SYS_RESOURCE, which ext4
    // lets write past a project quota.
    VolumeRef volume = 12;
  }
  bool read_only = 4;
  // For an image only: the same fields as a share block.
  string filesystem = 5;
  optional int32 partition = 6;
  string partition_label = 7;
  string partition_uuid = 8;
  repeated string protocols = 9;
  repeated Grant grants = 10;
  // Create it disabled: defined, checked, and not served until EnableShare.
  bool disabled = 11;
}

message CreateShareResponse {
  Share share = 1;
  Applied applied = 2;
}

// The fields of a share that can change without it becoming another share.
// Its source cannot: delete it and create another.
message UpdateShareRequest {
  string name = 1;
  optional bool read_only = 2;
  // Replaces the list when present; an empty list means every protocol.
  ProtocolList protocols = 3;
}

message UpdateShareResponse {
  Share share = 1;
  Applied applied = 2;
}

message ProtocolList {
  repeated string names = 1;
}

message DeleteShareRequest {
  string name = 1;
}

message DeleteShareResponse {
  Applied applied = 1;
}

message DisableShareRequest {
  string name = 1;
}

message DisableShareResponse {
  Share share = 1;
  Applied applied = 2;
}

message EnableShareRequest {
  string name = 1;
}

message EnableShareResponse {
  Share share = 1;
  Applied applied = 2;
}

message GrantRequest {
  string share = 1;
  Grant grant = 2;
}

message GrantResponse {
  Share share = 1;
  Applied applied = 2;
}

message RevokeRequest {
  string share = 1;
  Subject subject = 2;
}

message RevokeResponse {
  Share share = 1;
  Applied applied = 2;
}

message ReloadDirectoryRequest {}

message ReloadDirectoryResponse {
  repeated string added = 1;
  repeated string removed = 2;
  repeated string changed = 3;
  // True when a new generation was started; applied then says how many
  // connections were closed.
  bool new_generation = 4;
  Applied applied = 5;
  // Things a person should know: a group that no longer exists, somebody a
  // share names who is no longer in the directory.
  repeated string notes = 6;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message User {
  string name = 1;
  // Which source knows them.
  string source = 2;
  // The served protocols their credentials can answer.
  repeated string can_use = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message Group {
  string name = 1;
  repeated string members = 2;
}

// A VolumeRef names a volume the way the provisioner does: a parent from its
// configuration, and a name.
message VolumeRef {
  string parent = 1;
  string name = 2;
}

enum VolumeKind {
  VOLUME_KIND_UNSPECIFIED = 0;
  VOLUME_KIND_ZFS = 1;
  VOLUME_KIND_BTRFS = 2;
  VOLUME_KIND_XFS = 3;
  VOLUME_KIND_EXT4 = 4;
}

message Parent {
  string id = 1;
  VolumeKind kind = 2;
  // Where its volumes are: <root>/<name>.
  string root = 3;
  // Free and total space of what the volumes come from; 0 when unknown.
  uint64 free_bytes = 4;
  uint64 total_bytes = 5;
  // Whether SnapshotVolume works on its volumes.
  bool snapshots = 6;
}

message Volume {
  string parent = 1;
  string name = 2;
  VolumeKind kind = 3;
  // <parent root>/<name>.
  string path = 4;
  uint64 quota_bytes = 5;
  // What the filesystem charges to it, as the provisioner read it; 0 when it
  // could not.
  uint64 used_bytes = 6;
  google.protobuf.Timestamp created = 7;
  repeated string snapshots = 8;
  // The shares that use it: made from it, or with a directory inside it.
  repeated string shares = 9;
}

message ListParentsRequest {}

message ListParentsResponse {
  repeated Parent parents = 1;
  // The largest quota one volume may have.
  uint64 max_volume_bytes = 2;
}

message CreateVolumeRequest {
  string parent = 1;
  // ^[a-z0-9][a-z0-9_-]{0,62}$
  string name = 2;
  // 0 is refused: an unbounded volume is a configuration mistake.
  uint64 quota_bytes = 3;
}

message CreateVolumeResponse {
  Volume volume = 1;
  // False when it already existed with this quota.
  bool created = 2;
}

message ResizeVolumeRequest {
  string parent = 1;
  string name = 2;
  uint64 quota_bytes = 3;
}

message ResizeVolumeResponse {
  Volume volume = 1;
}

message SnapshotVolumeRequest {
  string parent = 1;
  string name = 2;
  // In the same grammar as a volume's name.
  string snapshot = 3;
}

message SnapshotVolumeResponse {
  Volume volume = 1;
  // False when the snapshot already existed.
  bool created = 2;
}

message DeleteVolumeRequest {
  string parent = 1;
  string name = 2;
  // Destroy its data and its snapshots too; without it a volume holding
  // either is FAILED_PRECONDITION.
  bool destroy_data = 3;
}

message DeleteVolumeResponse {
  // False when there was nothing to delete.
  bool deleted = 1;
}

message GetVolumeRequest {
  string parent = 1;
  string name = 2;
}

message GetVolumeResponse {
  Volume volume = 1;
}

message ListVolumesRequest {
  // Only this parent's; empty for every parent.
  string parent = 1;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}
